name: Publish eyelean-analysis to PyPI

# Builds and publishes the eyelean_analysis package to PyPI when a GitHub
# Release is published (or on manual dispatch). Authentication is PyPI
# Trusted Publishing (OIDC) — NO API token is stored in this repository.
#
# ONE-TIME SETUP on PyPI (https://pypi.org/manage/project/eyelean-analysis/settings/publishing/):
#   "Add a new pending publisher" / "Add a new publisher":
#     PyPI Project Name:  eyelean-analysis
#     Owner:              kubasuchy
#     Repository name:    <this repo, e.g. Eye-LEAN>
#     Workflow filename:  publish-pypi.yml
#     Environment name:   pypi
#
# The package version comes from eyelean_analysis/pyproject.toml. Bump it
# before publishing; `skip-existing` below means an umbrella release that
# does not change the Python version simply no-ops instead of failing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build + check
        working-directory: eyelean_analysis
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: eyelean_analysis/dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eyelean-analysis/
    permissions:
      id-token: write   # required for OIDC / Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
